# Intégration continue (#169) : à chaque push et à chaque PR, la suite Python,
# l'interface et les contrats JSON. Aucun secret AWS : les tests qui appellent
# vraiment Bedrock sont exclus par défaut (pytest -m bedrock, pyproject.toml),
# et les autres simulent S3 et Bedrock.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  interface:
    name: Interface (vitest et build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  contrats:
    name: Contrats JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Exemples du contrat et procès enregistrés de l'interface (sauf leur index).
      - run: |
          shopt -s nullglob
          proces=()
          for f in frontend/src/data/proces/*.json; do
            [ "$(basename "$f")" = index.json ] || proces+=("$f")
          done
          python -m contrat.valider docs/exemples/contrat_*.json "${proces[@]}"
