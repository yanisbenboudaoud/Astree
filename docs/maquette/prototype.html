<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaForge · Le Tribunal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF}
a{color:#1E3A8A}a:hover{color:#15296A}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #93B4F5;outline-offset:2px}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #F4F3EF; color: #15171C; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<header style="background: #15171C; color: #FFFFFF; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px">
  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0z"></path><path d="M19 7l-3 7a3.5 3.5 0 0 0 6 0z"></path><path d="M8 21h8"></path></svg>
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.01em">AlphaForge</span>
    <span style="font-size: 12px; color: #C9CCD3; border-left: 1px solid #3A3D45; padding-left: 10px">Le Tribunal de vos décisions</span>
  </div>
  <div style="flex: 1 1 auto"></div>
  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
    <span style="font-size: 12px; color: #C9CCD3">Profil de démo :</span>
    <template data-sc="for" list="{{personaTabs}}" as="pt" hint-placeholder-count="3">
      <button type="button" onClick="{{pt.pick}}" aria-pressed="{{pt.pressed}}" style="border: 1px solid {{pt.border}}; background: {{pt.bg}}; color: {{pt.fg}}; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; min-height: 36px">{{pt.label}}</button>
    </template>
  </div>
  <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: #3A2A06; color: #F6D88A; border-radius: 6px; padding: 6px 10px">Simulation · aucune transaction réelle · pas un conseil personnalisé</span>
</header>

<nav aria-label="Étapes" style="background: #FFFFFF; border-bottom: 1px solid #E2E0DA; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
  <template data-sc="for" list="{{steps}}" as="s" hint-placeholder-count="4">
    <button type="button" onClick="{{s.go}}" disabled="{{s.disabled}}" style="display: flex; align-items: center; gap: 8px; border: none; background: {{s.bg}}; color: {{s.fg}}; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; min-height: 36px">
      <span style="display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; background: {{s.dotBg}}; color: {{s.dotFg}}">{{s.n}}</span>{{s.label}}
    </button>
  </template>
  <div style="flex: 1 1 auto"></div>
  <span style="font-size: 12px; color: #5B606B">{{p.name}} · {{p.meta}}</span>
</nav>

<main style="max-width: 1360px; margin: 0 auto; padding: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 12px; color: #5B606B; margin-bottom: 16px">
  <span style="font-weight: 600; color: #15171C">Légende :</span>
  <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: #E6EEF9; color: #1E3A8A">Fait</span>donnée calculée ou règle déclarée, avec sa source</span>
  <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: #FDF4DF; color: #7A4F00">Hypothèse</span>interprétation ou information à confirmer</span>
  <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: #F1EAFB; color: #5B2A86">Fictif</span>persona, portefeuille ou scénario simulé</span>
</div>


<template data-sc="if" value="{{isDash}}" hint-placeholder-val="{{true}}">
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1 1 400px">
        <div style="font-size: 12px; color: #5B606B; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em">Tableau de bord</div>
        <h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; letter-spacing: -0.02em">Bonjour {{p.name}}</h1>
      </div>
      <div style="font-size: 12px; color: #5B606B">Période d'analyse : 12 nov. 2021 → 12 nov. 2026 · montants en CAD</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
      <template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 12px; padding: 16px">
          <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span style="font-size: 12px; color: #5B606B">{{k.label}}</span><span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: {{k.tagBg}}; color: {{k.tagFg}}">{{k.tag}}</span></div>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; margin-top: 4px">{{k.value}}</div>
          <div style="font-size: 12px; color: #5B606B; margin-top: 2px">{{k.sub}}</div>
        </div>
      </template>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px">
      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 12px; padding: 20px">
          <h2 style="margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px">Allocation actuelle <span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: #F1EAFB; color: #5B2A86">Fictif</span></h2>
          <div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px" role="img" aria-label="Répartition du portefeuille par catégorie">
            <template data-sc="for" list="{{alloc}}" as="a" hint-placeholder-count="5"><div style="width: {{a.pct}}%; background: {{a.c}}"></div></template>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px">
            <template data-sc="for" list="{{alloc}}" as="a" hint-placeholder-count="5">
              <div style="display: flex; align-items: center; gap: 6px; font-size: 13px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{a.c}}"></span>{{a.label}} <strong>{{a.pct}} %</strong></div>
            </template>
          </div>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 12px; padding: 20px">
          <h2 style="margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px">Positions <span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: #F1EAFB; color: #5B2A86">Fictif</span></h2>
          <div style="overflow-x: auto">
            <table style="width: 100%; border-collapse: collapse; font-size: 13px">
              <thead><tr style="text-align: left; color: #5B606B; font-size: 12px"><th style="padding: 8px 6px; border-bottom: 1px solid #E2E0DA">Titre</th><th style="padding: 8px 6px; border-bottom: 1px solid #E2E0DA">Nom</th><th style="padding: 8px 6px; border-bottom: 1px solid #E2E0DA; text-align: right">Poids</th><th style="padding: 8px 6px; border-bottom: 1px solid #E2E0DA; text-align: right">Rend. annualisé*</th><th style="padding: 8px 6px; border-bottom: 1px solid #E2E0DA; text-align: right">Volatilité*</th></tr></thead>
              <tbody>
                <template data-sc="for" list="{{positions}}" as="r" hint-placeholder-count="6">
                  <tr><td style="padding: 8px 6px; border-bottom: 1px solid #F0EEE9; font-weight: 600">{{r.t}}</td><td style="padding: 8px 6px; border-bottom: 1px solid #F0EEE9; color: #5B606B">{{r.n}}</td><td style="padding: 8px 6px; border-bottom: 1px solid #F0EEE9; text-align: right">{{r.w}} %</td><td style="padding: 8px 6px; border-bottom: 1px solid #F0EEE9; text-align: right">{{r.cagr}}</td><td style="padding: 8px 6px; border-bottom: 1px solid #F0EEE9; text-align: right">{{r.vol}}</td></tr>
                </template>
              </tbody>
            </table>
          </div>
          <p style="margin: 10px 0 0; font-size: 12px; color: #5B606B">* Par titre, dans sa devise de cotation (CAD pour .TO, USD pour les autres), 12 nov. 2021 → 12 nov. 2026. Les indicateurs du portefeuille sont calculés en CAD.</p>
        </div>
      </section>

      <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 12px; padding: 20px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <h2 style="margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px">Pacte de {{p.name}} <span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: #F1EAFB; color: #5B2A86">Fictif</span></h2>
            <span style="font-size: 11px; font-weight: 600; color: #157F3D; background: #E9F6EE; border-radius: 6px; padding: 4px 8px">Respecté</span>
          </div>
          <p style="margin: 6px 0 12px; font-size: 12px; color: #5B606B">Signé le 14 nov. 2026 · risque {{p.risk}} · horizon {{p.horizon}}</p>
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
            <template data-sc="for" list="{{p.pact}}" as="rule" hint-placeholder-count="4">
              <li style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#157F3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg>{{rule}}</li>
            </template>
          </ul>
        </div>
        <div style="background: #15171C; color: #FFFFFF; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="font-size: 12px; color: #C9CCD3; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em">Votre idée en cours</div>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">{{p.asset.title}}</div>
          <div style="font-size: 13px; color: #D9DBE0">{{p.asset.hook}}</div>
          <button type="button" onClick="{{toTicket}}" style="align-self: flex-start; margin-top: 6px; border: none; background: #FFFFFF; color: #15171C; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; min-height: 44px">Ouvrir la fiche →</button>
        </div>
      </aside>
    </div>
  </div>
</template>


<template data-sc="if" value="{{isTicket}}" hint-placeholder-val="{{false}}">
  <div style="display: flex; flex-wrap: wrap; gap: 20px">
    <section style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
      <div style="font-size: 12px; color: #5B606B; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em">Fiche</div>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; letter-spacing: -0.02em">{{p.asset.title}}</h1>
      <div style="font-size: 13px; color: #5B606B">{{p.asset.sub}}</div>
      <div style="display: flex; align-items: center; gap: 8px; background: #FDF4DF; color: #7A4F00; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A4F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>{{p.asset.badge}}
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <template data-sc="for" list="{{p.asset.stats}}" as="st" hint-placeholder-count="4">
          <div style="border: 1px solid #E2E0DA; border-radius: 10px; padding: 12px">
            <div style="font-size: 12px; color: #5B606B">{{st.k}}</div>
            <div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; margin-top: 2px">{{st.v}}</div>
          </div>
        </template>
      </div>
      <div style="font-size: 12px; color: #5B606B">Source : Yahoo Finance (prix ajustés, dividendes inclus), extraits le 13 nov. 2026 · devise précisée sur chaque indicateur · 12 nov. 2021 → 12 nov. 2026</div>
    </section>

    <section style="flex: 2 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-size: 17px">Paramètres de la décision</h2>
      <div style="border: 1px solid #E2E0DA; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px">
          <div>
            <label for="size" style="font-size: 12px; color: #5B606B; font-weight: 600">{{sizeLegend}}</label>
            <div style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1">{{sizeLabel}}</div>
            <div style="font-size: 12px; color: #5B606B">{{sizeSub}}</div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
            <span style="font-size: 12px; color: #5B606B">Raccourcis :</span>
            <template data-sc="for" list="{{presets}}" as="pr" hint-placeholder-count="4">
              <button type="button" onClick="{{pr.pick}}" style="border: 1px solid #C9C6BE; background: {{pr.bg}}; color: {{pr.fg}}; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; min-height: 36px">{{pr.label}}</button>
            </template>
          </div>
        </div>
        <div style="position: relative; padding-top: 22px">
          <div style="position: absolute; top: 0; left: {{okW}}%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: #11632F; white-space: nowrap">▼ Limite du Pacte</div>
          <input id="size" type="range" min="0" max="{{maxK}}" step="{{stepK}}" value="{{size}}" onChange="{{onSize}}" style="width: 100%; accent-color: #15171C; margin: 0; height: 28px">
          <div aria-hidden="true" style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px">
            <div style="width: {{okW}}%; background: #9ED9B3"></div>
            <div style="flex: 1 1 auto; background: #F4B4AD"></div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 11px; color: #5B606B; margin-top: 4px"><span>0 %</span><span>{{maxK}} %</span></div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px">
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #9ED9B3"></span>Compatible avec votre Pacte</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #F4B4AD"></span>En conflit</span>
          <span style="flex: 1 1 auto"></span>
          <strong>Taille maximale compatible : {{maxOkLabel}}</strong>
        </div>
        <template data-sc="if" value="{{hasFundings}}" hint-placeholder-val="{{true}}">
          <div style="border-top: 1px solid #F0EEE9; padding-top: 12px">
            <div style="font-size: 12px; color: #5B606B; font-weight: 600; margin-bottom: 8px">Financement de la position (simulé)</div>
            <div role="radiogroup" aria-label="Financement de la position" style="display: flex; flex-wrap: wrap; gap: 8px">
              <template data-sc="for" list="{{fundings}}" as="fd" hint-placeholder-count="2">
                <button type="button" role="radio" aria-checked="{{fd.checked}}" onClick="{{fd.pick}}" style="border: 2px solid {{fd.border}}; background: {{fd.bg}}; color: #15171C; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; min-height: 40px">{{fd.label}}</button>
              </template>
            </div>
          </div>
        </template>
        <div style="font-size: 12px; color: #5B606B">Chaque taille a été calculée d'avance par l'outil de calcul sur les données réelles (pas de 1 %{{stepNote}}) : aucun chiffre n'est estimé à la volée.</div>
      </div>

      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px">
          <thead><tr style="text-align: left; color: #5B606B; font-size: 12px"><th style="padding: 8px; border-bottom: 1px solid #E2E0DA">Indicateur (période étudiée)</th><th style="padding: 8px; border-bottom: 1px solid #E2E0DA; text-align: right">Portefeuille actuel</th><th style="padding: 8px; border-bottom: 1px solid #E2E0DA; text-align: right">Avec cette décision <span style="font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: #F1EAFB; color: #5B2A86">Fictif</span></th><th style="padding: 8px; border-bottom: 1px solid #E2E0DA; text-align: right">Limite du Pacte</th></tr></thead>
          <tbody>
            <template data-sc="for" list="{{compare}}" as="c" hint-placeholder-count="4">
              <tr><td style="padding: 10px 8px; border-bottom: 1px solid #F0EEE9">{{c.k}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #F0EEE9; text-align: right">{{c.a}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #F0EEE9; text-align: right; font-weight: 700; color: {{c.color}}">{{c.b}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #F0EEE9; text-align: right; color: #5B606B">{{c.lim}}</td></tr>
            </template>
          </tbody>
        </table>
      </div>

      <template data-sc="if" value="{{hasConflict}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; gap: 10px; align-items: flex-start; background: #FDECEA; color: #8F1C13; border-radius: 10px; padding: 12px 14px; font-size: 13px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8F1C13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
          <div><strong>Conflit détecté avec votre Pacte.</strong> {{conflictText}} Nous vous suggérons de soumettre cette décision au Tribunal avant de la simuler.</div>
        </div>
      </template>
      <template data-sc="if" value="{{noConflictChange}}" hint-placeholder-val="{{false}}">
        <div style="background: #E9F6EE; color: #11632F; border-radius: 10px; padding: 12px 14px; font-size: 13px"><strong>Aucun conflit avec votre Pacte.</strong> Vous pouvez tout de même demander un second regard.</div>
      </template>
      <template data-sc="if" value="{{isNone}}" hint-placeholder-val="{{false}}">
        <div style="background: #F1F0EC; color: #3F3F46; border-radius: 10px; padding: 12px 14px; font-size: 13px">Aucun changement au portefeuille : rien à juger.</div>
      </template>

      <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px">
        <button type="button" onClick="{{startTrial}}" disabled="{{isNone}}" style="border: none; background: {{trialBg}}; color: #FFFFFF; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 700; min-height: 48px; display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0z"></path><path d="M19 7l-3 7a3.5 3.5 0 0 0 6 0z"></path></svg>Soumettre au Tribunal
        </button>
        <button type="button" onClick="{{skipToVerdict}}" style="border: 1px solid #C9C6BE; background: #FFFFFF; color: #15171C; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 600; min-height: 48px">Simuler sans revue</button>
      </div>
    </section>
  </div>
</template>


<template data-sc="if" value="{{isTrial}}" hint-placeholder-val="{{false}}">
  <div style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <div style="flex: 1 1 400px">
        <div style="font-size: 12px; color: #5B606B; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em">Audience en cours</div>
        <h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; letter-spacing: -0.02em">{{p.name}} c. « {{opt.label}} »</h1>
      </div>
      <span style="font-size: 12px; color: #5B606B">Le Tribunal présente les deux côtés. C'est vous qui rendez le verdict.</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <aside aria-label="Trace d'exécution" style="flex: 1 1 280px; min-width: 0; background: #15171C; color: #FFFFFF; border-radius: 12px; padding: 18px">
        <div style="font-size: 12px; color: #C9CCD3; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px">Trace d'exécution des agents</div>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
          <template data-sc="for" list="{{trace}}" as="t" hint-placeholder-count="7">
            <li style="display: flex; gap: 10px; align-items: flex-start; opacity: {{t.op}}">

    checks.push(ddOk ? { tag: 'Conforme', text: 'Chute maximale ' + f(opt.dd) + ' ≥ seuil ' + f(p.ddMax) } : { tag: 'Violation', text: 'Chute maximale ' + f(opt.dd) + ' au-delà du seuil ' + f(p.ddMax), fail: true });
    extra.forEach((e) => checks.push(e.warn ? { tag: 'À vérifier', text: e.text, warn: true } : (e.ok ? { tag: 'Conforme', text: e.text } : { tag: 'Violation', text: e.text, fail: true })));
    checks.push({ tag: 'Conforme', text: 'Chiffres cités vérifiés contre leurs pièces : ' + cited + '/' + cited });
    checks.push({ tag: 'Avertissement', text: 'Performance passée invoquée : elle ne prédit pas l’avenir', warn: true });
    checks.push({ tag: 'Avertissement', text: 'Biais du survivant : univers choisi en 2026', warn: true });
    const checksV = checks.map((c) => Object.assign({}, c, { bg: c.fail ? '#FDECEA' : (c.warn ? '#FDF4DF' : '#E9F6EE'), fg: c.fail ? '#8F1C13' : (c.warn ? '#7A4F00' : '#11632F') }));

    const p2 = Object.assign({ id: 'P2' }, p.piece2);
    if (s.persona === 'robert') p2.value = '−2,6 % → ' + f(opt.y22);
    const pieceList = [
      { id: 'P1', tag: 'fictif', title: 'Simulation du portefeuille avec la décision', value: f(opt.dd) + ' max · ' + f(opt.cagr) + '/an', source: 'Yahoo Finance via yfinance (adj_close), extrait le 13 nov. 2026 ; USD/CAD Banque du Canada', method: 'Rendements quotidiens en CAD, calendrier des séances américaines, rééquilibrage quotidien, volatilité annualisée sur 252 séances, 12 nov. 2021 → 12 nov. 2026', limits: 'Une seule période de 5 ans ; univers choisi en 2026 (biais du survivant) ; le passé ne prédit pas l’avenir' },
      p2,
      { id: 'P3', tag: 'fictif', title: 'Pacte de ' + p.name, value: 'Signé le 14 nov. 2026', source: 'Déclaré par l’utilisateur (persona fictif)', method: 'Règles converties en contraintes vérifiables par l’agent Profil', limits: 'Le Pacte reflète les préférences déclarées, qui peuvent évoluer' }
    ];
    if (p.piece4) pieceList.push(p.piece4);
    if (p.piece5) pieceList.push(p.piece5);
    const pieces = pieceList.map((pc) => { const o = s.open === pc.id; return Object.assign({}, pc, tg(pc.tag), { open: o, toggle: open(pc.id), chev: o ? '▲' : '▼', bg: o ? '#F4F3EF' : '#FFFFFF', border: o ? '#15171C' : '#E2E0DA' }); });

    const questions = p.questions.map((q, i) => { const a = s.asked.indexOf(i) >= 0; return { q: q.q, asked: a, bg: a ? '#F1F0EC' : '#FFFFFF', ask: () => { if (this.state.asked.indexOf(i) < 0) this.setState({ asked: this.state.asked.concat([i]) }); } }; });
    const answers = s.asked.map((i) => p.questions[i]);

    const summary = [
      { k: 'Chute maximale', v: f(opt.dd), color: ddOk ? green : red },
      { k: 'Rendement annualisé', v: f(opt.cagr), color: ink },
      { k: 'Rejeu de 2022', v: f(opt.y22), color: ink },
      { k: 'Conformité au Pacte', v: isNone ? 'Aucun changement' : (hasConflict ? conflicts.length + ' conflit(s)' : 'Conforme'), color: hasConflict ? red : green }
    ];
    const vtxt = { keep: 'Décision maintenue', amend: 'Pacte ajusté par l’utilisateur' };
    const journal = s.verdict ? (vtxt[s.verdict] + ' : « ' + opt.label + ' » · ' + (hasConflict ? 'maintenue malgré ' + conflicts.length + ' conflit(s) signalé(s) par le Greffier.' : 'conforme au Pacte.') + (s.verdict === 'amend' ? ' La modification du Pacte est datée et visible dans l’historique.' : '')) : '';

    return {
      accent, p: Object.assign({}, p, { pieceCount: pieceList.length }), opt, personaTabs, steps, alloc, positions, kpis, compare, size, maxK, stepK: cfg.step, onSize, presets, fundings, hasFundings: fundings.length > 0, stepNote: cfg.step === 5 ? ', ici 5 %' : '', okW, curW, sizeLabel, sizeSub, maxOkLabel, sizeLegend, overLimit: size > maxOk,
      isDash: s.step === 'dash', isTicket: s.step === 'ticket', isTrial: s.step === 'trial', isVerdict: s.step === 'verdict',
      isNone, hasConflict, noConflictChange: !isNone && !hasConflict, conflictText: conflicts.join(' '),
      trialBg: isNone ? '#A9ACB3' : (hasConflict ? '#B4410F' : accent),
      toTicket: go('ticket'), startTrial: go('trial'), skipToVerdict: go('verdict'), toVerdict: go('verdict'), replay: () => this.runTrace(),
      trace, waiting: n < 4, showProc: n >= 5, showAvoc: n >= 6, showGreffe: done,
      proc, avoc, checks: checksV, pieces, questions, answers, summary,
      noDecision: !s.verdict, hasDecision: !!s.verdict, journal,
      keep: () => this.setState({ verdict: 'keep' }), amend: () => this.setState({ verdict: 'amend' }), modify: () => this.setState({ step: 'ticket', verdict: null }),
      restart: () => this.setState({ step: 'dash', verdict: null, trace: 0, asked: [], open: null })
    };
  }
}

const PROPS = { accent: '#1E3A8A', traceSpeed: 550 };
const app = new Component(PROPS);
window.__app = app;
const TPL = document.getElementById('tpl').content;
const EVT = { onClick: 'click', onChange: 'input' };
function lookup(path, scope){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path); const parts = path.split('.'); let v = scope; for (const p of parts) { if (v == null) return undefined; v = v[p]; } return v; }
function interp(str, scope){ const m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (m) return lookup(m[1], scope); return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); }); }
function addListeners(el, types){ el._types = el._types || new Set(); types.forEach((t) => { if (!el._types.has(t)) { el._types.add(t); el.addEventListener(t, (e) => { const h = el._h && el._h[t]; if (h) h(e); }); } }); }
function build(node, scope){
  const out = [];
  node.childNodes.forEach((n) => {
    if (n.nodeType === 3) { out.push(document.createTextNode(interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    if (n.tagName === 'TEMPLATE' && n.dataset.sc === 'if') { if (lookup(n.getAttribute('value').replace(/[{}]/g, ''), scope)) out.push(...build(n.content, scope)); return; }
    if (n.tagName === 'TEMPLATE' && n.dataset.sc === 'for') { const list = lookup(n.getAttribute('list').replace(/[{}]/g, ''), scope) || []; const as = n.getAttribute('as'); list.forEach((item, i) => { const sc = Object.create(scope); sc[as] = item; sc.$index = i; out.push(...build(n.content, sc)); }); return; }
    const el = document.createElement(n.tagName.toLowerCase());
    el._h = {};
    for (const a of n.attributes) {
      if (a.name.startsWith('hint-')) continue;
      const evName = Object.keys(EVT).find((k) => k.toLowerCase() === a.name);
      if (evName) { el._h[EVT[evName]] = interp(a.value, scope); continue; }
      const v = interp(a.value, scope);
      if (a.name === 'disabled') { if (v === true || v === 'true') el.setAttribute('disabled', ''); continue; }
      if (a.name === 'value' && n.tagName === 'INPUT') { el._value = String(v); el.setAttribute('value', String(v)); continue; }
      el.setAttribute(a.name, v == null ? '' : String(v));
    }
    addListeners(el, Object.keys(el._h));
    build(n, scope).forEach((c) => el.appendChild(c));
    out.push(el);
  });
  return out;
}
function syncAttrs(o, n){ for (const a of [...o.attributes]) if (!n.hasAttribute(a.name)) o.removeAttribute(a.name); for (const a of n.attributes) if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value); }
function patch(el, kids){
  const old = [...el.childNodes];
  kids.forEach((n, i) => {
    const o = old[i];
    if (!o) { el.appendChild(n); return; }
    if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) { el.replaceChild(n, o); return; }
    if (n.nodeType === 3) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; return; }
    syncAttrs(o, n); o._h = n._h; addListeners(o, Object.keys(n._h || {}));
    if (o.tagName === 'INPUT' && n._value !== undefined && o.value !== n._value) o.value = n._value;
    patch(o, [...n.childNodes]);
  });
  for (let i = old.length - 1; i >= kids.length; i--) el.removeChild(old[i]);
}
let queued = false;
function scheduleRender(){ if (queued) return; queued = true; Promise.resolve().then(() => { queued = false; renderNow(); }); }
function renderNow(){ patch(document.getElementById('root'), build(TPL, app.renderVals())); }
window.renderNow = renderNow;
renderNow();

</script>
