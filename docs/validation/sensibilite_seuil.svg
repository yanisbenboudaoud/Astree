<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="titre desc">
<title id="titre">Taille maximale compatible selon le seuil de pire baisse</title>
<desc id="desc">Profil prudent, décision : 30 % en TSLA, financement proportionnel. Plus le seuil de pire baisse toléré est bas, plus la position compatible avec le Pacte est grande : −8 % donne 1 %, −9 % donne 5 %, −10 % donne 7 %, −11 % donne 8 %, −12 % donne 9 %, −13 % donne 11 %, −14 % donne 12 %, −15 % donne 13 %, −16 % donne 14 %, −17 % donne 15 %, −18 % donne 16 %, −19 % donne 18 %, −20 % donne 19 %, −21 % donne 20 %, −22 % donne 21 %, −23 % donne 22 %, −24 % donne 23 %, −25 % donne 25 %, −26 % donne 26 %, −27 % donne 27 %, −28 % donne 28 %, −29 % donne 30 %, −30 % donne 30 %.</desc>
